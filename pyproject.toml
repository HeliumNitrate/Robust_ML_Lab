[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rmlab"
version = "0.0.1"
description = "Robust ML Lab: imbalanced data, anomaly detection, OOD and trustworthy ML experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["omegaconf>=2.3"]

[project.optional-dependencies]
dev = ["pytest>=8.4", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
